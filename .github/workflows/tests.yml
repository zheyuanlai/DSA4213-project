name: Tests and artifact integrity
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository (full history for the secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline test suite (no API calls; private data is absent and those tests skip)
        run: python -m pytest -q
      - name: Frozen-artifact integrity (public checks)
        run: python scripts/verify_artifacts.py
      - name: Secret and privacy scan of tree, index and history
        run: python scripts/security_check.py
