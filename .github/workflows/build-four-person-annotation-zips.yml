name: Build four-person annotation ZIPs
on:
  push:
    paths:
      - '.github/workflows/build-four-person-annotation-zips.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-annotation-zips:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build archived annotation packets from frozen inputs
        run: python -m evaluation.four_person build
      - name: Verify splits, viewers, checklists and archives
        run: python -m evaluation.four_person check
      - name: Upload coordinator-only artifact (all stages)
        uses: actions/upload-artifact@v4
        with:
          name: four-person-annotation-stage-zips
          path: annotation/four_person/dist/*.zip
          if-no-files-found: error
          retention-days: 7
