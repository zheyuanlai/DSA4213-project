[project]
name = "dsa4213-evidence-calibration"
version = "0.1.0"
description = "Saying What the Evidence Shows: overstatement and understatement in agent-written Results sections (DSA4213 Group 5)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "httpx>=0.27,<1", "PyYAML>=6.0", "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
